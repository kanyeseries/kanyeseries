<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reset password | Kanye Series</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"></head>
<body class="grid min-h-screen place-items-center bg-slate-100 p-4"><main class="w-full max-w-md rounded-3xl bg-white p-7 shadow-xl sm:p-9"><a href="login.html" class="text-sm font-bold text-blue-800 hover:underline"><i class="bi bi-arrow-left mr-1"></i>Back to login</a><h1 class="mt-6 text-3xl font-black">Reset your password</h1><p class="mt-3 text-sm leading-6 text-slate-600">Enter the email address for your account and weÃ¢â‚¬â„¢ll send a reset link.</p><form id="form" class="mt-7"><label for="email" class="text-sm font-bold">Email address</label><input id="email" type="email" required autocomplete="email" class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-blue-700" placeholder="you@example.com"><button id="submit" class="mt-5 w-full rounded-xl bg-blue-800 px-5 py-3 font-bold text-white hover:bg-blue-900">Send reset link</button><p id="status" class="mt-4 hidden rounded-xl p-3 text-sm" role="status"></p></form></main>
<script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";import{getAuth,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";const a=initializeApp({apiKey:"AIzaSyDsiaLtwcZT3-5QcT11zDHOI4MIWJtpjLA",authDomain:"kanysersies.firebaseapp.com",projectId:"kanysersies",appId:"1:462876427635:web:34817fdec3ee7a3c896299"}),auth=getAuth(a),form=document.getElementById("form"),status=document.getElementById("status"),button=document.getElementById("submit");form.addEventListener("submit",async e=>{e.preventDefault();button.disabled=true;status.className="mt-4 hidden rounded-xl p-3 text-sm";try{await sendPasswordResetEmail(auth,document.getElementById("email").value.trim());status.textContent="If an account uses that email address, a reset link has been sent.";status.className="mt-4 rounded-xl bg-emerald-50 p-3 text-sm text-emerald-800";}catch(error){console.error(error);status.textContent="We could not send the reset link. Check the email address and try again.";status.className="mt-4 rounded-xl bg-red-50 p-3 text-sm text-red-800";}finally{button.disabled=false;}});</script></body></html>
