<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Special order | Kanye Series</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"></head>
<body class="min-h-screen bg-slate-50 text-slate-900"><header class="border-b bg-white"><div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-4"><a href="index.html" class="font-black text-blue-950"><i class="bi bi-bag-heart-fill mr-2 text-blue-800"></i>KANYE SERIES</a><a href="products.html" class="text-sm font-bold text-blue-800">Browse products</a></div></header><main class="mx-auto max-w-3xl px-4 py-12"><p class="text-xs font-bold uppercase tracking-widest text-blue-700">Can’t find what you need?</p><h1 class="mt-2 text-4xl font-black">Request a special order</h1><p class="mt-4 max-w-2xl leading-7 text-slate-600">Tell us what you’re looking for. Our team will review your request and get in touch.</p><form id="form" class="mt-8 space-y-5 rounded-3xl border bg-white p-6 shadow-sm sm:p-8"><div><label for="name" class="text-sm font-bold">Your name</label><input id="name" required class="mt-2 w-full rounded-xl border px-4 py-3" autocomplete="name"></div><div><label for="phone" class="text-sm font-bold">Phone number</label><input id="phone" required class="mt-2 w-full rounded-xl border px-4 py-3" autocomplete="tel"></div><div><label for="request" class="text-sm font-bold">What would you like us to source?</label><textarea id="request" required rows="5" class="mt-2 w-full rounded-xl border px-4 py-3" placeholder="Include the product, preferred size/model, condition and any other details."></textarea></div><button id="submit" class="rounded-xl bg-blue-800 px-5 py-3 font-bold text-white hover:bg-blue-900">Submit request</button><p id="status" class="hidden rounded-xl p-3 text-sm" role="status"></p></form></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";import{getDatabase,ref,push,set}from"https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";const app=initializeApp({apiKey:"AIzaSyBx-4BgpCY5OuKRzifPv2xQBtQ8w323wis",authDomain:"kanyeseries-d511b.firebaseapp.com",projectId:"kanyeseries-d511b",storageBucket:"kanyeseries-d511b.firebasestorage.app",messagingSenderId:"212048886528",appId:"1:212048886528:web:235f96016a4de83ec991e5",measurementId:"G-7LS8NYFX7Y"}),auth=getAuth(app),db=getDatabase(app),form=document.getElementById("form"),button=document.getElementById("submit"),status=document.getElementById("status");let user=null;onAuthStateChanged(auth,u=>user=u);form.addEventListener("submit",async e=>{e.preventDefault();if(!user){location.href="login.html";return;}button.disabled=true;try{const order=push(ref(db,"specialOrders"));await set(order,{orderId:order.key,userId:user.uid,customerName:document.getElementById("name").value.trim(),phone:document.getElementById("phone").value.trim(),request:document.getElementById("request").value.trim(),description:document.getElementById("request").value.trim(),status:"pending",createdAt:Date.now()});form.reset();status.textContent="Your request has been sent. We’ll be in touch soon.";status.className="rounded-xl bg-emerald-50 p-3 text-sm text-emerald-800";}catch(error){console.error(error);status.textContent="We could not send your request. Please try again.";status.className="rounded-xl bg-red-50 p-3 text-sm text-red-800";}finally{button.disabled=false;}});</script></body></html>
